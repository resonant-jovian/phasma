name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '32 23 * * 5' # weekly lint (Friday 23:32 UTC)

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - name: Compile test binaries
        run: cargo test --no-run --verbose

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (clippy + fmt)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Install SARIF tools
        run: cargo install clippy-sarif sarif-fmt
      - name: Run clippy
        run: >
          cargo clippy
          --features notifications,jemalloc,mimalloc,dhat
          --message-format=json | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt
        continue-on-error: true
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true

  # ── Tests ──────────────────────────────────────────────────────────────────
  tests:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev
      - name: Run tests
        run: cargo test --verbose 2>&1 | tee test-output.txt
      - name: Test summary
        if: always()
        run: |
          echo "## Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          result=$(grep '^test result:' test-output.txt || echo "test result: unknown")
          echo "**Result:** \`$result\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          failed=$(grep '\.\.\.\ FAILED' test-output.txt || true)
          if [ -n "$failed" ]; then
            echo "### Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            panics=$(sed -n '/^failures:$/,/^test result:/p' test-output.txt | head -50)
            if [ -n "$panics" ]; then
              echo "### Panic details" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$panics" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi
